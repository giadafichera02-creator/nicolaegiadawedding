<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee1cf">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Nicola & Giada — Invito</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee1cf}
    body{font-family:Georgia,serif}
    .cover{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#eee1cf;
    }
    .cover img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      user-select:none;
      pointer-events:none;
      animation:entrance 1.1s ease both;
    }
    .open-link{
      position:absolute;
      z-index:20;
      left:50%;
      top:70.8%;
      width:28%;
      height:13%;
      min-width:270px;
      min-height:82px;
      transform:translate(-50%,-50%);
      border-radius:999px;
      text-decoration:none;
      background:rgba(255,255,255,.001);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .open-link::after{
      content:"";
      position:absolute;
      inset:8%;
      border-radius:999px;
      opacity:.18;
      background:radial-gradient(ellipse,rgba(255,235,170,.55),transparent 70%);
      animation:pulse 2.2s ease-in-out infinite;
    }
    .open-link:hover{filter:drop-shadow(0 0 20px rgba(224,185,93,.55))}
    .petal{
      position:absolute;
      z-index:10;
      top:-8%;
      width:15px;
      height:23px;
      border-radius:70% 30% 66% 34%;
      opacity:.62;
      background:linear-gradient(145deg,#fffdf9,#ead8c7);
      pointer-events:none;
      animation:fall linear infinite;
    }
    .p1{left:10%;animation-duration:7s;animation-delay:-1s}
    .p2{left:28%;animation-duration:8.5s;animation-delay:-5s}
    .p3{left:67%;animation-duration:6.8s;animation-delay:-3s}
    .p4{left:88%;animation-duration:9s;animation-delay:-6s}
    @keyframes entrance{
      from{opacity:0;transform:scale(1.035);filter:blur(4px)}
      to{opacity:1;transform:none;filter:none}
    }
    @keyframes pulse{
      0%,100%{opacity:.12;transform:scale(.94)}
      50%{opacity:.75;transform:scale(1.12)}
    }
    @keyframes fall{
      from{transform:translate3d(0,-20px,0) rotate(0)}
      to{transform:translate3d(65px,110vh,0) rotate(390deg);opacity:.08}
    }
    @media(max-width:680px){
      .open-link{
        top:70.6%;
        width:65%;
        min-width:190px;
        height:14%;
        min-height:75px;
      }
    }
  </style>
</head>
<body>
  <main class="cover">
    <img src="copertina-romantica.png" alt="Invito al matrimonio di Nicola e Giada">
    <span class="petal p1"></span>
    <span class="petal p2"></span>
    <span class="petal p3"></span>
    <span class="petal p4"></span>
    <a class="open-link" href="invito.html" aria-label="Apri il nostro invito"></a>
  </main>
</body>
</html>
